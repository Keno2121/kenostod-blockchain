<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Deep royal background gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </radialGradient>
    <!-- Shield face gradient - deep navy to midnight blue -->
    <linearGradient id="shieldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b4b"/>
      <stop offset="50%" stop-color="#091033"/>
      <stop offset="100%" stop-color="#050b22"/>
    </linearGradient>
    <!-- Gold gradient for borders and ornaments -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e642"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="60%" stop-color="#e8b800"/>
      <stop offset="100%" stop-color="#c8960a"/>
    </linearGradient>
    <!-- Gold bright for crown highlights -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5a0"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <!-- Shield outer glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft drop shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <!-- 6174 text glow -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Clip path for shield shape -->
    <clipPath id="shieldClip">
      <path d="M250,60 L390,95 L390,240 Q390,350 250,430 Q110,350 110,240 L110,95 Z"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="248" fill="url(#bg)"/>
  <circle cx="250" cy="250" r="248" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>

  <!-- Subtle outer ring decoration -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.25" stroke-dasharray="4 6"/>

  <!-- ══════════════════════════════════════════ -->
  <!--  SHIELD BODY                               -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Shield shadow/depth layer -->
  <path d="M250,62 L392,97 L392,242 Q392,354 250,436 Q108,354 108,242 L108,97 Z"
        fill="#000" opacity="0.5" transform="translate(4,6)" filter="url(#shadow)"/>

  <!-- Shield outer gold border -->
  <path d="M250,60 L390,95 L390,240 Q390,350 250,430 Q110,350 110,240 L110,95 Z"
        fill="url(#gold)" filter="url(#glow)"/>

  <!-- Shield inner dark face -->
  <path d="M250,70 L378,102 L378,238 Q378,340 250,416 Q122,340 122,238 L122,102 Z"
        fill="url(#shieldFace)"/>

  <!-- Shield inner gold trim ring -->
  <path d="M250,70 L378,102 L378,238 Q378,340 250,416 Q122,340 122,238 L122,102 Z"
        fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>

  <!-- Horizontal divider bar (heraldic fess) -->
  <rect x="122" y="218" width="256" height="3" fill="url(#gold)" opacity="0.5" clip-path="url(#shieldClip)"/>

  <!-- Vertical divider (heraldic pale) -->
  <rect x="249" y="70" width="2" height="346" fill="url(#gold)" opacity="0.3" clip-path="url(#shieldClip)"/>

  <!-- Four quadrant subtle patterns -->
  <!-- Top-left: subtle cross-hatch pattern -->
  <g clip-path="url(#shieldClip)" opacity="0.07">
    <line x1="130" y1="80" x2="200" y2="150" stroke="#ffd700" stroke-width="1"/>
    <line x1="145" y1="80" x2="215" y2="150" stroke="#ffd700" stroke-width="1"/>
    <line x1="160" y1="80" x2="230" y2="150" stroke="#ffd700" stroke-width="1"/>
    <line x1="175" y1="80" x2="245" y2="150" stroke="#ffd700" stroke-width="1"/>
    <line x1="190" y1="80" x2="248" y2="138" stroke="#ffd700" stroke-width="1"/>
    <line x1="130" y1="95" x2="200" y2="165" stroke="#ffd700" stroke-width="1"/>
    <line x1="130" y1="110" x2="200" y2="180" stroke="#ffd700" stroke-width="1"/>
    <line x1="130" y1="125" x2="200" y2="195" stroke="#ffd700" stroke-width="1"/>
    <line x1="130" y1="140" x2="200" y2="210" stroke="#ffd700" stroke-width="1"/>
  </g>

  <!-- ══════════════════════════════════════════ -->
  <!--  CORNER ORNAMENTS — Fleur-de-lis style     -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Top-left ornament star -->
  <g transform="translate(165,148)" opacity="0.8">
    <polygon points="0,-12 2.8,-3.8 11.4,-3.8 4.7,1.5 7.0,9.8 0,4.8 -7.0,9.8 -4.7,1.5 -11.4,-3.8 -2.8,-3.8"
             fill="url(#gold)" opacity="0.7"/>
  </g>
  <!-- Top-right ornament star -->
  <g transform="translate(335,148)" opacity="0.8">
    <polygon points="0,-12 2.8,-3.8 11.4,-3.8 4.7,1.5 7.0,9.8 0,4.8 -7.0,9.8 -4.7,1.5 -11.4,-3.8 -2.8,-3.8"
             fill="url(#gold)" opacity="0.7"/>
  </g>
  <!-- Bottom-left ornament diamond -->
  <polygon points="168,310 176,322 168,334 160,322" fill="url(#gold)" opacity="0.6"/>
  <!-- Bottom-right ornament diamond -->
  <polygon points="332,310 340,322 332,334 324,322" fill="url(#gold)" opacity="0.6"/>

  <!-- ══════════════════════════════════════════ -->
  <!--  KAPREKAR NUMBER — 6174                    -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Subtle glow backdrop for number -->
  <ellipse cx="250" cy="265" rx="95" ry="52" fill="#ffd700" opacity="0.06"/>

  <!-- The number 6174 -->
  <text x="250" y="295"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="82"
        font-weight="bold"
        fill="url(#goldBright)"
        text-anchor="middle"
        letter-spacing="-2"
        filter="url(#textGlow)">6174</text>

  <!-- Thin underline rule below 6174 -->
  <line x1="160" y1="308" x2="340" y2="308" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>

  <!-- ══════════════════════════════════════════ -->
  <!--  SHIELD LABEL — SHIELD text at bottom      -->
  <!-- ══════════════════════════════════════════ -->
  <text x="250" y="380"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        font-weight="bold"
        fill="url(#gold)"
        text-anchor="middle"
        letter-spacing="8">SHIELD</text>

  <!-- ══════════════════════════════════════════ -->
  <!--  ROYAL CROWN — above shield                -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Crown base band -->
  <rect x="190" y="28" width="120" height="18" rx="3" fill="url(#gold)"/>
  <!-- Crown base highlight -->
  <rect x="190" y="28" width="120" height="5" rx="3" fill="#fff8a0" opacity="0.4"/>

  <!-- Crown left spike -->
  <polygon points="198,28 204,4 213,28" fill="url(#gold)"/>
  <!-- Crown left-center spike -->
  <polygon points="222,28 229,0 238,28" fill="url(#gold)"/>
  <!-- Crown center spike (tallest) -->
  <polygon points="242,28 250,-6 258,28" fill="url(#gold)"/>
  <!-- Crown right-center spike -->
  <polygon points="262,28 271,0 280,28" fill="url(#gold)"/>
  <!-- Crown right spike -->
  <polygon points="287,28 296,4 302,28" fill="url(#gold)"/>

  <!-- Gem on center spike -->
  <circle cx="250" cy="2" r="5" fill="#cc0000"/>
  <circle cx="250" cy="2" r="3" fill="#ff4444"/>
  <circle cx="249" cy="1" r="1.2" fill="#ff9999"/>

  <!-- Gem on left-center spike -->
  <circle cx="230" cy="8" r="4" fill="#1a00cc"/>
  <circle cx="230" cy="8" r="2.5" fill="#4444ff"/>
  <circle cx="229" cy="7" r="1" fill="#aaaaff"/>

  <!-- Gem on right-center spike -->
  <circle cx="270" cy="8" r="4" fill="#006600"/>
  <circle cx="270" cy="8" r="2.5" fill="#00aa00"/>
  <circle cx="269" cy="7" r="1" fill="#88ff88"/>

  <!-- Crown small gems on base band -->
  <circle cx="215" cy="37" r="3" fill="#cc0000" opacity="0.9"/>
  <circle cx="250" cy="37" r="3.5" fill="#ffd700"/>
  <circle cx="250" cy="37" r="2" fill="#fff8a0"/>
  <circle cx="285" cy="37" r="3" fill="#cc0000" opacity="0.9"/>

  <!-- Crown band bottom decorative dots -->
  <circle cx="205" cy="43" r="2" fill="#b8860b" opacity="0.7"/>
  <circle cx="220" cy="43" r="2" fill="#b8860b" opacity="0.7"/>
  <circle cx="235" cy="43" r="2" fill="#b8860b" opacity="0.7"/>
  <circle cx="250" cy="43" r="2.5" fill="#ffd700"/>
  <circle cx="265" cy="43" r="2" fill="#b8860b" opacity="0.7"/>
  <circle cx="280" cy="43" r="2" fill="#b8860b" opacity="0.7"/>
  <circle cx="295" cy="43" r="2" fill="#b8860b" opacity="0.7"/>

  <!-- ══════════════════════════════════════════ -->
  <!--  SHIELD TOP ORNAMENTAL BOSS               -->
  <!-- ══════════════════════════════════════════ -->
  <!-- The "boss" — center embossed circle at top of shield face -->
  <circle cx="250" cy="155" r="36" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <circle cx="250" cy="155" r="28" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>

  <!-- Crown silhouette inside boss -->
  <g transform="translate(250,155)" opacity="0.6">
    <!-- Small inner crown icon -->
    <rect x="-18" y="6" width="36" height="6" rx="1" fill="url(#gold)"/>
    <polygon points="-14,6 -11,-4 -7,6" fill="url(#gold)"/>
    <polygon points="-3,6 0,-8 3,6" fill="url(#gold)"/>
    <polygon points="7,6 11,-4 14,6" fill="url(#gold)"/>
    <circle cx="0" cy="-9" r="2" fill="#ffd700"/>
    <circle cx="-11" cy="-4" r="1.5" fill="#ffd700"/>
    <circle cx="11" cy="-4" r="1.5" fill="#ffd700"/>
  </g>

  <!-- ══════════════════════════════════════════ -->
  <!--  SIDE LAUREL BRANCHES — regal trim         -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Left laurel branch -->
  <g opacity="0.55" fill="url(#gold)">
    <ellipse cx="138" cy="195" rx="8" ry="4" transform="rotate(-40,138,195)"/>
    <ellipse cx="130" cy="212" rx="8" ry="4" transform="rotate(-50,130,212)"/>
    <ellipse cx="126" cy="230" rx="8" ry="4" transform="rotate(-55,126,230)"/>
    <ellipse cx="128" cy="248" rx="8" ry="4" transform="rotate(-60,128,248)"/>
    <path d="M140,185 Q128,220 132,260" stroke="url(#gold)" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  <!-- Right laurel branch -->
  <g opacity="0.55" fill="url(#gold)">
    <ellipse cx="362" cy="195" rx="8" ry="4" transform="rotate(40,362,195)"/>
    <ellipse cx="370" cy="212" rx="8" ry="4" transform="rotate(50,370,212)"/>
    <ellipse cx="374" cy="230" rx="8" ry="4" transform="rotate(55,374,230)"/>
    <ellipse cx="372" cy="248" rx="8" ry="4" transform="rotate(60,372,248)"/>
    <path d="M360,185 Q372,220 368,260" stroke="url(#gold)" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

</svg>
